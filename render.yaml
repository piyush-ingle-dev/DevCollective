services:
  - type: web
    name: devcollective-app
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_WS_URL
        value: wss://devcollective-ws.onrender.com
      - key: APP_URL
        value: https://devcollective-app.onrender.com

  - type: web
    name: devcollective-ws
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start:ws
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
